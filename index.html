<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="Gracias por confiar en Rasel. Elige tu peluquería y comparte tu experiencia en Google.">
    <title>Tu opinión importa · Rasel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <!-- Símbolo vectorial provisional inspirado en la referencia. Sustituible por el logo definitivo. -->
        <div class="brand-mark">
          <svg class="monogram" viewBox="165 250 730 510" role="img" aria-label="Rasel" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="champagne-metal" x1="0" y1="0" x2=".8" y2="1">
                <stop offset="0" stop-color="#9f7550"/>
                <stop offset=".24" stop-color="#edcba3"/>
                <stop offset=".39" stop-color="#fff0da"/>
                <stop offset=".53" stop-color="#b88960"/>
                <stop offset=".72" stop-color="#e5bb8e"/>
                <stop offset="1" stop-color="#fff0dc"/>
              </linearGradient>
            </defs>
            <g fill="url(#champagne-metal)" stroke="#f3d7b3" stroke-width="1.5" stroke-linejoin="round">
              <path d="M193 485C298 355 512 260 632 279C736 288 723 353 649 419C584 477 471 531 429 543C513 551 565 591 634 639C712 692 789 709 875 691C762 729 667 698 583 645C502 594 459 557 387 553C457 509 553 444 610 389C675 327 653 299 583 309C446 320 297 397 193 485Z"/>
              <path d="M449 387C407 485 332 630 238 737C286 620 365 473 449 387Z"/>
            </g>
          </svg>
        </div>
        <h1>TU OPINIÓN<br><span>IMPORTA</span></h1>
        <div class="signature-line" aria-hidden="true"></div>
        <div class="intro-copy">
          <p class="welcome">Gracias por confiar en nosotros.</p>
          <p class="question">¿En cuál de nuestras peluquerías<br>has estado hoy?</p>
        </div>
      </header>

      <section class="salons" aria-label="Elige tu peluquería"></section>
      <noscript><p class="notice">Activa JavaScript para seleccionar tu peluquería.</p></noscript>
      <p class="notice" id="review-status" role="status" hidden></p>

      <footer>
        <p>Gracias por ayudarnos a seguir creciendo.</p>
        <svg class="heart" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
      </footer>
    </main>
  </body>
</html>
